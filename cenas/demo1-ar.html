<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Demo 01 AR - Primitives Morphing</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; background: #000; }
    a, button { -webkit-tap-highlight-color: transparent; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,0.08); pointer-events: none;
    }
    #hud .badge {
      font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
      color: #30d158; background: rgba(48,209,88,0.1); border: 1px solid #30d158;
      border-radius: 4px; padding: 3px 8px;
    }
    #hud .title { font-size: 13px; font-weight: 500; color: #f5f5f7; letter-spacing: .01em; }
    #hud .sub { font-size: 11px; color: #6e6e73; }
    #back {
      position: fixed; top: 56px; left: 16px; z-index: 9999;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
      color: #f5f5f7; padding: 7px 14px;
      border-radius: 980px; text-decoration: none; font-size: 13px; font-weight: 500;
      border: 1px solid rgba(255,255,255,0.12);
    }
    #back:hover { background: rgba(255,255,255,0.1); }
    #info {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      z-index: 9999; pointer-events: none;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 980px; padding: 10px 22px;
      font-size: 13px; color: #6e6e73; text-align: center; white-space: nowrap;
    }
    #info span { color: #2997ff; }
  </style>
</head>
<body>
  <div id="hud">
    <span class="badge">AR</span>
    <span class="title">Demo 01 — Primitives Morphing</span>
    <span class="sub">Hiro Marker</span>
  </div>
  <a href="demo1.html" id="back">&#8592; Exit AR</a>
  <div id="info">Current primitive: <span id="prim-name">a-box</span></div>
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; antialias: true;" loading-screen="enabled: false">
    <a-entity camera></a-entity>
    <a-marker preset="hiro" id="marker">
      <a-entity id="shape" position="0 0.5 0"></a-entity>
      <a-light type="point" color="#4488ff" intensity="1.5" distance="5" position="0 2 0"></a-light>
      <a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>
    </a-marker>
  </a-scene>
  <script>
    const PRIMITIVES=[{tag:'a-box',attrs:{}},{tag:'a-sphere',attrs:{radius:'0.4'}},{tag:'a-cylinder',attrs:{radius:'0.32',height:'0.6'}},{tag:'a-cone',attrs:{'radius-bottom':'0.36',height:'0.7'}},{tag:'a-torus',attrs:{radius:'0.36','radius-tubular':'0.08'}},{tag:'a-torus-knot',attrs:{radius:'0.32','radius-tubular':'0.04'}},{tag:'a-icosahedron',attrs:{radius:'0.4'}},{tag:'a-dodecahedron',attrs:{radius:'0.4'}},{tag:'a-octahedron',attrs:{radius:'0.4'}},{tag:'a-tetrahedron',attrs:{radius:'0.4'}}];
    const COLORS=['#00c853','#ffd600','#2979ff','#ff1a1a','#00e5ff','#ff6d00','#d500f9','#76ff03','#f50057','#ffffff'];
    let current=null,index=0;
    const container=document.getElementById('shape'),nameEl=document.getElementById('prim-name');
    const INTERVAL=2800,FADE_MS=600;
    function randColor(){return COLORS[Math.floor(Math.random()*COLORS.length)];}
    function randFloat(min,max){return(Math.random()*(max-min)+min).toFixed(2);}
    function buildMaterial(){const metalness=randFloat(0,1),roughness=randFloat(0,1),opacity=randFloat(0.35,1);const color=randColor(),emissive=Math.random()>0.6?randColor():'#000000';const wireframe=Math.random()>0.85?'true':'false',transparent=opacity<0.99?'true':'false';return `color:${color}; roughness:${roughness}; metalness:${metalness}; opacity:${opacity}; transparent:${transparent}; emissive:${emissive}; emissiveIntensity:0.4; wireframe:${wireframe}`;}
    function spawnNext(){const def=PRIMITIVES[index%PRIMITIVES.length];index++;const el=document.createElement(def.tag);for(const[k,v]of Object.entries(def.attrs))el.setAttribute(k,v);el.setAttribute('material',buildMaterial());el.setAttribute('scale','0.001 0.001 0.001');el.setAttribute('rotation',`${Math.random()*360} ${Math.random()*360} ${Math.random()*360}`);el.setAttribute('animation__rot','property:rotation; to:'+`${Math.random()*720} ${360+Math.random()*360} ${Math.random()*360}`+'; dur:'+(INTERVAL*4)+'; easing:linear; loop:true');el.setAttribute('animation__scale_in','property:scale; from:0.001 0.001 0.001; to:1 1 1; dur:'+FADE_MS+'; easing:easeOutCubic');container.appendChild(el);nameEl.textContent=def.tag;if(current){const dying=current;dying.setAttribute('animation__scale_out','property:scale; to:0.001 0.001 0.001; dur:'+FADE_MS+'; easing:easeInCubic');setTimeout(()=>{if(dying.parentNode)dying.parentNode.removeChild(dying);},FADE_MS+50);}current=el;}
    document.querySelector('a-scene').addEventListener('loaded',()=>{spawnNext();setInterval(spawnNext,INTERVAL);});
  </script>
</body>
</html>
