<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Demo 04 - AR [WIP]</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; background: #000; }
    a, button { -webkit-tap-highlight-color: transparent; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,0.08); pointer-events: none;
    }
    #hud .badge {
      font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
      color: #ff9f0a; background: rgba(255,159,10,0.1); border: 1px solid #ff9f0a;
      border-radius: 4px; padding: 3px 8px;
    }
    #hud .title { font-size: 13px; font-weight: 500; color: #f5f5f7; letter-spacing: .01em; }
    #hud .status { font-size: 11px; color: #6e6e73; }
    #tip {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 980px; padding: 10px 22px;
      font-size: 13px; color: #6e6e73;
      text-align: center; pointer-events: none; white-space: nowrap;
    }
    #tip span { color: #2997ff; }
    #back {
      position: fixed; top: 56px; left: 16px; z-index: 9999;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
      color: #f5f5f7; padding: 7px 14px;
      border-radius: 980px; text-decoration: none; font-size: 13px; font-weight: 500;
      border: 1px solid rgba(255,255,255,0.12);
    }
    #back:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <div id="hud">
    <span class="badge">WIP</span>
    <span class="title">Demo 04 — AR</span>
    <span class="status">AR.js · Hiro Marker</span>
  </div>
  <a href="../index.html" id="back">&#8592; Back</a>
  <div id="tip">Point the camera at the <span>Hiro</span> marker to see the 3D object</div>
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; antialias: true;" loading-screen="enabled: false">
    <a-entity camera></a-entity>
    <a-marker preset="hiro" id="marker">
      <a-sphere position="0 0.5 0" radius="0.3" material="color: #2979ff; roughness: 0.1; metalness: 0.9; emissive: #112244; emissiveIntensity: 0.4" animation="property: rotation; to: 0 360 0; dur: 4000; easing: linear; loop: true"></a-sphere>
      <a-torus position="0 0.5 0" radius="0.6" radius-tubular="0.018" material="color: #00c853; roughness: 0; metalness: 1; emissive: #00c853; emissiveIntensity: 0.6" rotation="75 0 0" animation="property: rotation; from: 75 0 0; to: 75 360 0; dur: 3200; easing: linear; loop: true"></a-torus>
      <a-entity position="0 0.5 0" animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 3200; easing: linear; loop: true">
        <a-sphere position="0.6 0 0" radius="0.09" material="color: #00e5ff; roughness: 0; metalness: 0; emissive: #00e5ff; emissiveIntensity: 1"></a-sphere>
      </a-entity>
      <a-light type="point" color="#2979ff" intensity="1.5" distance="3" position="0 1 0"></a-light>
    </a-marker>
  </a-scene>
</body>
</html>
