<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Demo 01 - 3D Primitives</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1d1d1f;
      --muted: #6e6e73;
      --subtle: #f5f5f7;
      --border: #d2d2d7;
      --accent: #0071e3;
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000000; --fg: #f5f5f7; --muted: #a1a1a6; --subtle: #111113; --border: #2a2a2e; --accent: #2997ff; }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a, button { -webkit-tap-highlight-color: transparent; }
    #back {
      position: fixed; top: 16px; left: 16px; z-index: 9999;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
      color: #f5f5f7; padding: 8px 16px;
      border-radius: 980px; text-decoration: none; font-size: 13px; font-weight: 500;
      border: 1px solid rgba(255,255,255,0.12);
      transition: background .2s;
    }
    #back:hover { background: rgba(255,255,255,0.15); }
    #btn-ar {
      position: fixed; top: 16px; right: 16px; z-index: 9999;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      color: var(--accent); border: 1px solid var(--accent);
      padding: 8px 16px; border-radius: 980px;
      font-size: 13px; font-weight: 500;
      cursor: pointer; text-decoration: none;
      display: flex; align-items: center; gap: 6px;
      transition: background .2s;
    }
    #btn-ar:hover { background: color-mix(in srgb, var(--accent) 28%, transparent); }
    #info {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
      color: #a1a1a6; padding: 10px 20px;
      border-radius: 980px; font-size: 13px; font-weight: 500;
      pointer-events: none; text-align: center; white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.08);
    }
    #info span { color: var(--accent); }
    a-scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  </style>
</head>
<body>
  <a href="../index.html" id="back">&#8592; Back</a>
  <a href="demo1-ar.html" id="btn-ar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M2 8V5a2 2 0 0 1 2-2h3"/><path d="M17 3h3a2 2 0 0 1 2 2v3"/>
      <path d="M22 16v3a2 2 0 0 1-2 2h-3"/><path d="M7 21H4a2 2 0 0 1-2-2v-3"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
    AR Mode
  </a>
  <div id="info">Current primitive: <span id="prim-name">a-box</span> &nbsp;|&nbsp; Drag to rotate</div>
  <a-scene background="color: #0a0a0a">
    <a-light type="ambient" color="#ffffff" intensity="0.4"></a-light>
    <a-light type="point" color="#ffffff" intensity="2" position="3 5 3" distance="20" decay="1"></a-light>
    <a-light type="point" color="#4488ff" intensity="1" position="-4 2 -2" distance="15" decay="2"></a-light>
    <a-entity id="shape" position="0 1.4 -4"></a-entity>
    <a-camera position="0 1.6 0" look-controls wasd-controls></a-camera>
  </a-scene>
  <script>
    const PRIMITIVES=[{tag:'a-box',attrs:{}},{tag:'a-sphere',attrs:{radius:'0.9'}},{tag:'a-cylinder',attrs:{radius:'0.7',height:'1.4'}},{tag:'a-cone',attrs:{'radius-bottom':'0.8',height:'1.6'}},{tag:'a-torus',attrs:{radius:'0.8','radius-tubular':'0.18'}},{tag:'a-torus-knot',attrs:{radius:'0.7','radius-tubular':'0.08'}},{tag:'a-icosahedron',attrs:{radius:'0.9'}},{tag:'a-dodecahedron',attrs:{radius:'0.9'}},{tag:'a-octahedron',attrs:{radius:'0.9'}},{tag:'a-tetrahedron',attrs:{radius:'0.9'}}];
    const COLORS=['#00c853','#ffd600','#2979ff','#ff1a1a','#00e5ff','#ff6d00','#d500f9','#76ff03','#f50057','#ffffff'];
    const INTERVAL=2800,FADE_MS=700;
    let current=null,index=0,intervalId=null,started=false;

    const container=document.getElementById('shape'),nameEl=document.getElementById('prim-name');

    function randColor(){return COLORS[Math.floor(Math.random()*COLORS.length)];}
    function randFloat(min,max){return(Math.random()*(max-min)+min).toFixed(2);}

    function buildMaterial(opacity){
      const metalness=randFloat(0,1),roughness=randFloat(0,1);
      const color=randColor(),emissive=Math.random()>0.6?randColor():'#000000';
      const wireframe=Math.random()>0.85?'true':'false';
      return `color:${color}; roughness:${roughness}; metalness:${metalness}; opacity:${opacity}; transparent:true; emissive:${emissive}; emissiveIntensity:0.4; wireframe:${wireframe}`;
    }

    function spawnNext(){
      const def=PRIMITIVES[index%PRIMITIVES.length];
      index++;

      // Build new element fully transparent
      const el=document.createElement(def.tag);
      for(const[k,v]of Object.entries(def.attrs))el.setAttribute(k,v);
      el.setAttribute('material',buildMaterial(0));
      el.setAttribute('rotation',`${Math.random()*360} ${Math.random()*360} ${Math.random()*360}`);
      el.setAttribute('animation__rot',
        'property:rotation; to:'+`${Math.random()*720} ${360+Math.random()*360} ${Math.random()*360}`+
        '; dur:'+(INTERVAL*4)+'; easing:linear; loop:true'
      );
      // Fade in via opacity
      el.setAttribute('animation__fadein',
        'property:material.opacity; from:0; to:1; dur:'+FADE_MS+'; easing:easeOutQuad'
      );

      container.appendChild(el);
      nameEl.textContent=def.tag;

      // Fade out the old element, then remove it
      if(current){
        const dying=current;
        dying.removeAttribute('animation__fadein');
        dying.setAttribute('animation__fadeout',
          'property:material.opacity; from:1; to:0; dur:'+FADE_MS+'; easing:easeInQuad'
        );
        setTimeout(()=>{ if(dying.parentNode) dying.parentNode.removeChild(dying); }, FADE_MS+50);
      }

      current=el;
    }

    const scene=document.querySelector('a-scene');
    scene.addEventListener('loaded',()=>{
      // Guard against multiple 'loaded' firings (e.g. after hot-reload / F5 in some browsers)
      if(started) return;
      started=true;

      spawnNext();
      intervalId=setInterval(spawnNext,INTERVAL);
    });

    // Clean up on page unload so stale intervals never survive
    window.addEventListener('beforeunload',()=>{
      if(intervalId!==null){ clearInterval(intervalId); intervalId=null; }
    });
  </script>
</body>
</html>
