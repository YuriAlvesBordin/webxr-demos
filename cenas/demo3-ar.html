<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Demo 03 AR - External 3D Model</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; background: #000; }
    a, button { -webkit-tap-highlight-color: transparent; }
    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,0.08); pointer-events: none;
    }
    #hud .badge {
      font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
      color: #2997ff; background: rgba(41,151,255,0.1); border: 1px solid #2997ff;
      border-radius: 4px; padding: 3px 8px;
    }
    #hud .title { font-size: 13px; font-weight: 500; color: #f5f5f7; letter-spacing: .01em; }
    #hud .sub { font-size: 11px; color: #6e6e73; }
    #back {
      position: fixed; top: 56px; left: 16px; z-index: 9999;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
      color: #f5f5f7; padding: 7px 14px;
      border-radius: 980px; text-decoration: none; font-size: 13px; font-weight: 500;
      border: 1px solid rgba(255,255,255,0.12);
    }
    #back:hover { background: rgba(255,255,255,0.1); }
    #drop-screen {
      position: fixed; inset: 0; z-index: 8000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: rgba(0,0,0,0.88); backdrop-filter: blur(4px);
    }
    #drop-screen p { font-size: 13px; color: #6e6e73; text-align: center; max-width: 260px; line-height: 1.6; }
    #drop-zone {
      width: 280px; border: 1.5px dashed #2a2a2e; border-radius: 12px;
      padding: 36px 24px; text-align: center; cursor: pointer;
      background: #111113; transition: border-color .2s, background .2s;
    }
    #drop-zone.over { border-color: #2997ff; background: rgba(41,151,255,0.05); }
    #drop-zone strong { display: block; font-size: 15px; font-weight: 600; color: #f5f5f7; margin-bottom: 6px; }
    #drop-zone span { font-size: 13px; color: #6e6e73; }
    #btn-pick {
      background: #2997ff; color: #fff; border: none;
      padding: 10px 28px; border-radius: 980px;
      font-size: 14px; font-weight: 500; cursor: pointer;
      transition: opacity .15s;
    }
    #btn-pick:hover { opacity: .85; }
    #file-input { display: none; }
    #model-hud {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 9999; display: none; align-items: center; gap: 12px;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 980px; padding: 10px 20px;
    }
    #model-hud strong { font-size: 13px; font-weight: 600; color: #2997ff; white-space: nowrap; }
    #btn-remove {
      background: none; border: 1px solid rgba(255,255,255,0.12); color: #a1a1a6;
      padding: 5px 12px; border-radius: 980px;
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    #btn-remove:hover { border-color: #ff453a; color: #ff453a; }
  </style>
</head>
<body>
  <div id="hud">
    <span class="badge">AR</span>
    <span class="title">Demo 03 — External 3D Model</span>
    <span class="sub">Hiro Marker</span>
  </div>
  <a href="demo3.html" id="back">&#8592; Exit AR</a>
  <div id="drop-screen">
    <div id="drop-zone">
      <strong>Select a 3D model</strong>
      <span>.glb &nbsp;·&nbsp; .gltf &nbsp;·&nbsp; .obj</span>
    </div>
    <button id="btn-pick">Select file</button>
    <p>The model will be displayed over the <strong style="color:#2997ff">Hiro</strong> marker in AR.</p>
    <input type="file" id="file-input" accept=".glb,.gltf,.obj">
  </div>
  <div id="model-hud">
    <strong id="hud-name"></strong>
    <button id="btn-remove">Remove</button>
  </div>
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; antialias: true;" loading-screen="enabled: false">
    <a-entity camera></a-entity>
    <a-marker preset="hiro" id="marker">
      <a-entity id="model-wrapper" position="0 0 0"></a-entity>
      <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
      <a-light type="directional" color="#ffffff" intensity="1.5" position="1 2 1"></a-light>
    </a-marker>
  </a-scene>
  <script>
    const dropScreen=document.getElementById('drop-screen'),dropZone=document.getElementById('drop-zone'),fileInput=document.getElementById('file-input'),btnPick=document.getElementById('btn-pick'),modelHud=document.getElementById('model-hud'),hudName=document.getElementById('hud-name'),btnRemove=document.getElementById('btn-remove'),wrapper=document.getElementById('model-wrapper');
    let blobURL=null,modelEl=null;
    btnPick.addEventListener('click',()=>fileInput.click());
    dropZone.addEventListener('click',()=>fileInput.click());
    dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('over');});
    dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('over'));
    dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('over');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0]);});
    fileInput.addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0]);});
    function clearModel(){if(modelEl&&modelEl.parentNode)modelEl.parentNode.removeChild(modelEl);modelEl=null;if(blobURL){URL.revokeObjectURL(blobURL);blobURL=null;}}
    function loadFile(file){const ext=file.name.split('.').pop().toLowerCase();if(!['glb','gltf','obj'].includes(ext)){alert('Use .glb, .gltf or .obj');return;}clearModel();blobURL=URL.createObjectURL(file);modelEl=document.createElement('a-entity');if(ext==='obj')modelEl.setAttribute('obj-model','obj: '+blobURL);else modelEl.setAttribute('gltf-model',blobURL);modelEl.setAttribute('scale','0.3 0.3 0.3');wrapper.appendChild(modelEl);modelEl.addEventListener('model-loaded',()=>{const obj=modelEl.getObject3D('mesh');if(!obj)return;obj.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(obj);const size=new THREE.Vector3();const center=new THREE.Vector3();box.getSize(size);box.getCenter(center);const maxDim=Math.max(size.x,size.y,size.z);const scale=maxDim>0?(0.8/maxDim):0.3;modelEl.object3D.scale.set(scale,scale,scale);modelEl.object3D.position.set(-center.x*scale,-center.y*scale+0.1,-center.z*scale);hudName.textContent=file.name;dropScreen.style.display='none';modelHud.style.display='flex';});modelEl.addEventListener('model-error',()=>{alert('Error loading model.');clearModel();});}
    btnRemove.addEventListener('click',()=>{clearModel();fileInput.value='';modelHud.style.display='none';dropScreen.style.display='flex';});
  </script>
</body>
</html>
